<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jayshri Gautam | Student Study Planner</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<h1>📚 Student Study Planner</h1>
<p class="author">Developed by <b>Jayshri Gautam</b></p>

<!-- TASK FORM -->

<div class="task-form">

<input type="text" id="taskInput" placeholder="Study Task">

<input type="text" id="subjectInput" placeholder="Subject">

<input type="date" id="dateInput">

<select id="priorityInput">
<option value="Low">Low Priority</option>
<option value="Medium">Medium Priority</option>
<option value="High">High Priority</option>
</select>

<button onclick="addTask()">Add Task</button>

</div>

<!-- FILTER -->

<select id="subjectFilter" onchange="filterTasks()">
<option value="all">All Subjects</option>
</select>

<!-- PROGRESS -->

<div class="progress">

<div class="progress-bar">
<div id="progressFill"></div>
</div>

<p id="progressText">0% Completed</p>

</div>

<!-- TASK LIST -->

<ul id="taskList"></ul>

<!-- TIMER -->

<div class="timer">

<h2>⏱ Study Timer</h2>

<p id="time">25:00</p>

<button onclick="startTimer()">Start</button>
<button onclick="resetTimer()">Reset</button>

</div>

</div>

<footer>
<p>© 2025 Jayshri Gautam | Study Planner Web App</p>
</footer>

<script src="script.js"></script>

</body>
</html>
